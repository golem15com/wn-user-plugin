# ===================================
#  Form Field Definitions
# ===================================

fields:
    name:
        label: golem15.user::lang.organisation.name
        span: left
        required: true

    slug:
        label: golem15.user::lang.organisation.slug
        span: right
        comment: golem15.user::lang.organisation.slug_comment
        preset:
            field: name
            type: slug

    description:
        label: golem15.user::lang.organisation.description
        type: textarea
        size: small

    avatar:
        label: golem15.user::lang.organisation.avatar
        type: fileupload
        mode: image
        imageWidth: 120
        imageHeight: 120

    members:
        type: partial
        path: $/golem15/user/controllers/organisations/_members.htm
        tab: golem15.user::lang.organisation.members
        span: full
        context: update
