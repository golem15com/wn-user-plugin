# ===================================
#  Field Definitions
# ===================================

tabs:
    fields:
        # Throttle Sign In
        use_throttle:
            span: left
            label: golem15.user::lang.settings.use_throttle
            comment: golem15.user::lang.settings.use_throttle_comment
            type: switch
            tab: golem15.user::lang.settings.signin_tab

        # Prevent concurrent sessions
        block_persistence:
            span: right
            label: golem15.user::lang.settings.block_persistence
            comment: golem15.user::lang.settings.block_persistence_comment
            type: switch
            tab: golem15.user::lang.settings.signin_tab

        # Login Attribute
        login_attribute:
            span: left
            label: golem15.user::lang.settings.login_attribute
            commentAbove: golem15.user::lang.settings.login_attribute_comment
            type: radio
            tab: golem15.user::lang.settings.signin_tab

        # Remeber Login Mode
        remember_login:
            span: right
            label: golem15.user::lang.settings.remember_login
            commentAbove: golem15.user::lang.settings.remember_login_comment
            type: radio
            tab: golem15.user::lang.settings.signin_tab

        # Require Activation
        allow_registration:
            span: left
            label: golem15.user::lang.settings.allow_registration
            comment: golem15.user::lang.settings.allow_registration_comment
            type: switch
            tab: golem15.user::lang.settings.registration_tab

        # Enable registration throttling
        use_register_throttle:
            span: right
            label: golem15.user::lang.settings.use_register_throttle
            comment: golem15.user::lang.settings.use_register_throttle_comment
            type: switch
            tab: golem15.user::lang.settings.registration_tab

        # Require Activation
        require_activation:
            span: left
            label: golem15.user::lang.settings.require_activation
            comment: golem15.user::lang.settings.require_activation_comment
            type: switch
            tab: golem15.user::lang.settings.activation_tab

        # Activation Mode
        activate_mode:
            span: left
            commentAbove: golem15.user::lang.settings.activate_mode_comment
            label: golem15.user::lang.settings.activate_mode
            type: radio
            tab: golem15.user::lang.settings.activation_tab

        # Headless activation URL (frontend/SPA)
        activation_url:
            span: left
            label: golem15.user::lang.settings.activation_url
            commentAbove: golem15.user::lang.settings.activation_url_comment
            placeholder: 'https://www.example.com/user/activate/:code'
            type: text
            tab: golem15.user::lang.settings.activation_tab

        # Headless password-reset URL (frontend/SPA)
        reset_url:
            span: right
            label: golem15.user::lang.settings.reset_url
            commentAbove: golem15.user::lang.settings.reset_url_comment
            placeholder: 'https://www.example.com/reset-password?code=:code'
            type: text
            tab: golem15.user::lang.settings.activation_tab

        # Two-Factor Authentication Mode
        two_factor_mode:
            span: left
            label: golem15.user::lang.settings.two_factor_mode
            commentAbove: golem15.user::lang.settings.two_factor_mode_comment
            type: radio
            tab: golem15.user::lang.settings.two_factor_tab

        # Available 2FA Methods
        two_factor_available_methods:
            span: right
            label: golem15.user::lang.settings.two_factor_available_methods
            comment: golem15.user::lang.settings.two_factor_available_methods_comment
            type: checkboxlist
            tab: golem15.user::lang.settings.two_factor_tab

        # Email Code TTL
        two_factor_email_code_ttl:
            span: left
            label: golem15.user::lang.settings.two_factor_email_code_ttl
            comment: golem15.user::lang.settings.two_factor_email_code_ttl_comment
            type: number
            default: 10
            tab: golem15.user::lang.settings.two_factor_tab

        # Challenge TTL
        two_factor_challenge_ttl:
            span: right
            label: golem15.user::lang.settings.two_factor_challenge_ttl
            comment: golem15.user::lang.settings.two_factor_challenge_ttl_comment
            type: number
            default: 5
            tab: golem15.user::lang.settings.two_factor_tab

        # Passwordless Security Key Login
        two_factor_passwordless_login:
            span: full
            label: golem15.user::lang.settings.two_factor_passwordless_login
            comment: golem15.user::lang.settings.two_factor_passwordless_login_comment
            type: switch
            tab: golem15.user::lang.settings.two_factor_tab

        # Trust Device
        trusted_device_enabled:
            span: left
            label: golem15.user::lang.settings.trusted_device_enabled
            comment: golem15.user::lang.settings.trusted_device_enabled_comment
            type: switch
            tab: golem15.user::lang.settings.two_factor_tab

        trusted_device_ttl_days:
            span: right
            label: golem15.user::lang.settings.trusted_device_ttl_days
            comment: golem15.user::lang.settings.trusted_device_ttl_days_comment
            type: number
            default: 30
            tab: golem15.user::lang.settings.two_factor_tab
            trigger:
                action: show
                field: trusted_device_enabled
                condition: checked

        # Enforce for Groups
        two_factor_enforce_groups:
            span: full
            label: golem15.user::lang.settings.two_factor_enforce_groups
            comment: golem15.user::lang.settings.two_factor_enforce_groups_comment
            type: checkboxlist
            tab: golem15.user::lang.settings.two_factor_tab
            trigger:
                action: show
                field: two_factor_mode
                condition: value[enforced]

        # Social Providers overview
        _social_overview_hint:
            type: hint
            label: golem15.user::lang.settings.social_overview_hint_label
            path: ~/plugins/golem15/user/models/settings/_social_overview_hint.php
            tab: golem15.user::lang.settings.social_tab

        # Google section
        _google_section:
            type: section
            label: golem15.user::lang.settings.google_section
            tab: golem15.user::lang.settings.social_tab

        _google_oauth_hint:
            type: hint
            path: ~/plugins/golem15/user/models/settings/_google_oauth_hint.php
            tab: golem15.user::lang.settings.social_tab

        google_client_id:
            span: left
            label: golem15.user::lang.settings.google_client_id
            comment: golem15.user::lang.settings.google_client_id_comment
            type: text
            tab: golem15.user::lang.settings.social_tab

        google_client_secret:
            span: right
            label: golem15.user::lang.settings.google_client_secret
            comment: golem15.user::lang.settings.google_client_secret_comment
            type: text
            attributes:
                type: password
                autocomplete: off
            tab: golem15.user::lang.settings.social_tab

        # Facebook section
        _facebook_section:
            type: section
            label: golem15.user::lang.settings.facebook_section
            tab: golem15.user::lang.settings.social_tab

        _facebook_oauth_hint:
            type: hint
            path: ~/plugins/golem15/user/models/settings/_facebook_oauth_hint.php
            tab: golem15.user::lang.settings.social_tab

        facebook_client_id:
            span: left
            label: golem15.user::lang.settings.facebook_client_id
            comment: golem15.user::lang.settings.facebook_client_id_comment
            type: text
            tab: golem15.user::lang.settings.social_tab

        facebook_client_secret:
            span: right
            label: golem15.user::lang.settings.facebook_client_secret
            comment: golem15.user::lang.settings.facebook_client_secret_comment
            type: text
            attributes:
                type: password
                autocomplete: off
            tab: golem15.user::lang.settings.social_tab

        # GitHub section
        _github_section:
            type: section
            label: golem15.user::lang.settings.github_section
            tab: golem15.user::lang.settings.social_tab

        _github_oauth_hint:
            type: hint
            path: ~/plugins/golem15/user/models/settings/_github_oauth_hint.php
            tab: golem15.user::lang.settings.social_tab

        github_client_id:
            span: left
            label: golem15.user::lang.settings.github_client_id
            comment: golem15.user::lang.settings.github_client_id_comment
            type: text
            tab: golem15.user::lang.settings.social_tab

        github_client_secret:
            span: right
            label: golem15.user::lang.settings.github_client_secret
            comment: golem15.user::lang.settings.github_client_secret_comment
            type: text
            attributes:
                type: password
                autocomplete: off
            tab: golem15.user::lang.settings.social_tab
