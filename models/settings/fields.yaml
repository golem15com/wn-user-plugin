# ===================================
#  Field Definitions
# ===================================

tabs:
    fields:
        # Throttle Sign In
        use_throttle:
            span: left
            label: golem15.user::lang.settings.use_throttle
            comment: golem15.user::lang.settings.use_throttle_comment
            type: switch
            tab: golem15.user::lang.settings.signin_tab

        # Prevent concurrent sessions
        block_persistence:
            span: right
            label: golem15.user::lang.settings.block_persistence
            comment: golem15.user::lang.settings.block_persistence_comment
            type: switch
            tab: golem15.user::lang.settings.signin_tab

        # Login Attribute
        login_attribute:
            span: left
            label: golem15.user::lang.settings.login_attribute
            commentAbove: golem15.user::lang.settings.login_attribute_comment
            type: radio
            tab: golem15.user::lang.settings.signin_tab

        # Remeber Login Mode
        remember_login:
            span: right
            label: golem15.user::lang.settings.remember_login
            commentAbove: golem15.user::lang.settings.remember_login_comment
            type: radio
            tab: golem15.user::lang.settings.signin_tab

        # Require Activation
        allow_registration:
            span: left
            label: golem15.user::lang.settings.allow_registration
            comment: golem15.user::lang.settings.allow_registration_comment
            type: switch
            tab: golem15.user::lang.settings.registration_tab

        # Enable registration throttling
        use_register_throttle:
            span: right
            label: golem15.user::lang.settings.use_register_throttle
            comment: golem15.user::lang.settings.use_register_throttle_comment
            type: switch
            tab: golem15.user::lang.settings.registration_tab

        # Require Activation
        require_activation:
            span: left
            label: golem15.user::lang.settings.require_activation
            comment: golem15.user::lang.settings.require_activation_comment
            type: switch
            tab: golem15.user::lang.settings.activation_tab

        # Activation Mode
        activate_mode:
            span: left
            commentAbove: golem15.user::lang.settings.activate_mode_comment
            label: golem15.user::lang.settings.activate_mode
            type: radio
            tab: golem15.user::lang.settings.activation_tab

        # Two-Factor Authentication Mode
        two_factor_mode:
            span: left
            label: golem15.user::lang.settings.two_factor_mode
            commentAbove: golem15.user::lang.settings.two_factor_mode_comment
            type: radio
            tab: golem15.user::lang.settings.two_factor_tab

        # Available 2FA Methods
        two_factor_available_methods:
            span: right
            label: golem15.user::lang.settings.two_factor_available_methods
            comment: golem15.user::lang.settings.two_factor_available_methods_comment
            type: checkboxlist
            tab: golem15.user::lang.settings.two_factor_tab

        # Email Code TTL
        two_factor_email_code_ttl:
            span: left
            label: golem15.user::lang.settings.two_factor_email_code_ttl
            comment: golem15.user::lang.settings.two_factor_email_code_ttl_comment
            type: number
            default: 10
            tab: golem15.user::lang.settings.two_factor_tab

        # Challenge TTL
        two_factor_challenge_ttl:
            span: right
            label: golem15.user::lang.settings.two_factor_challenge_ttl
            comment: golem15.user::lang.settings.two_factor_challenge_ttl_comment
            type: number
            default: 5
            tab: golem15.user::lang.settings.two_factor_tab

        # Enforce for Groups
        two_factor_enforce_groups:
            span: full
            label: golem15.user::lang.settings.two_factor_enforce_groups
            comment: golem15.user::lang.settings.two_factor_enforce_groups_comment
            type: checkboxlist
            tab: golem15.user::lang.settings.two_factor_tab
            trigger:
                action: show
                field: two_factor_mode
                condition: value[enforced]
