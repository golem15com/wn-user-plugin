<div class="reset-complete">
    <div class="reset-complete-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22,4 12,14.01 9,11.01"/>
        </svg>
    </div>
    <h2 class="reset-complete-title">{{ 'Password Reset Complete'|_ }}</h2>
    <p class="reset-complete-message">
        {{ 'Your password has been successfully reset. You can now sign in with your new password.'|_ }}
    </p>
    <a href="{{ 'signin'|page }}" class="btn btn-primary btn-full">{{ 'Sign In'|_ }}</a>
</div>
