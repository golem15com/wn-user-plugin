<p class="reset-intro">
    {{ 'Create a new password for your account.'|_ }}
</p>

<form id="resetPasswordForm">
    <input type="hidden" name="_token" value="{{ this.session.get('_token') }}">
    <input type="hidden" name="_handler" value="resetPassword::onResetPassword">
    <input type="hidden" name="code" value="{{ __SELF__.code }}">

    <div class="form-group">
        <label class="form-label" for="resetPassword">{{ 'New Password'|_ }} <span class="required">*</span></label>
        <input
            name="password"
            type="password"
            class="form-control"
            id="resetPassword"
            placeholder="{{ 'Enter your new password'|_ }}"
            autocomplete="new-password"
            required/>
    </div>

    <div class="form-group">
        <label class="form-label" for="resetPasswordConfirm">{{ 'Confirm Password'|_ }} <span class="required">*</span></label>
        <input
            name="password_confirmation"
            type="password"
            class="form-control"
            id="resetPasswordConfirm"
            placeholder="{{ 'Confirm your new password'|_ }}"
            autocomplete="new-password"
            required/>
    </div>

    <button type="submit" class="btn btn-primary btn-full">{{ 'Reset Password'|_ }}</button>

    <div id="resetFlash" class="form-flash"></div>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var form = document.getElementById('resetPasswordForm');
    var flashEl = document.getElementById('resetFlash');

    if (!form) return;

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        flashEl.innerHTML = '';
        flashEl.className = 'form-flash';

        Snowboard.request(form, 'resetPassword::onResetPassword', {
            flash: true,
            update: { 'resetPassword::complete': '#partialUserResetForm' },
            loading: function(el) {
                el.classList.add('loading');
            },
            success: function(data) {
                form.classList.remove('loading');
                // Will be replaced by complete partial
            },
            error: function(data) {
                form.classList.remove('loading');
                if (data.message) {
                    flashEl.innerHTML = data.message;
                    flashEl.classList.add('form-flash-error');
                }
            }
        });
    });
});
</script>
