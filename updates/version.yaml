    - "Database maintenance. Updated all timestamp columns to be nullable."
    - v1.2.5/update_timestamp_nullable.php
"1.2.6":
    - "Add a dedicated last seen column for users."
    - v1.2.6/users_add_last_seen.php
"1.2.7": "Minor fix to user timestamp attributes."
"1.2.8": "Add date range filter to users list. Introduced a logout event."
"1.2.9": "Add invitation mail for new accounts created in the back-end."
"1.3.0":
    - "Introduced guest user accounts."
    - v1.3.0/users_add_guest_flag.php
    - v1.3.0/users_add_superuser_flag.php
"1.3.1": "User notification variables can now be extended."
"1.3.2": "Minor fix to the Auth::register method."
"1.3.3": "Allow prevention of concurrent user sessions via the user settings."
"1.3.4": "Added force secure protocol property to the account component."
"1.4.0": "!!! The Notifications tab in User settings has been removed."
